  <script>
    // Theme: "light" or "dark" on <html> before first paint, from the choice saved by Settings'
    // Appearance control, else the system setting, which System keeps following. Every control
    // marked data-theme-input shows the same choice.
    (function () {
      var d = document, root = d.documentElement, key = "mealscholar-theme", choice = "";
      var system = matchMedia("(prefers-color-scheme: dark)");
      try { choice = localStorage.getItem(key) || ""; } catch (e) {}
      if (choice !== "light" && choice !== "dark") choice = "";
      function apply() {
        var theme = choice || (system.matches ? "dark" : "light");
        if (root.dataset.theme === theme) return;
        // A switch repaints at once: no button fades between the palettes for the next two frames.
        root.classList.add("theme-switching");
        root.dataset.theme = theme;
        d.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111112" : "#EEF0F2";
        d.querySelector('meta[name="color-scheme"]').content = theme;
        requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove("theme-switching"); }); });
      }
      function sync() {
        var value = choice || "system";
        d.querySelectorAll("[data-theme-input]").forEach(function (input) { input.checked = input.value === value; });
      }
      apply();
      system.addEventListener("change", apply);
      d.addEventListener("change", function (e) {
        if (!e.target.matches("[data-theme-input]")) return;
        choice = e.target.value === "system" ? "" : e.target.value;
        try { if (choice) localStorage.setItem(key, choice); else localStorage.removeItem(key); } catch (err) {}
        apply();
        sync();
      });
      d.addEventListener("DOMContentLoaded", sync);
      window.MealScholarTheme = { choice: function () { return choice || "system"; } };
    })();
  </script>

            <img alt="The meal photo being analyzed">
            <span class="scan" aria-hidden="true"></span>
            <p class="viewfinder__working" aria-hidden="true"><span class="spinner"></span><span>Identifying foods &middot; estimating amounts</span></p>
          </div>
        </div>
        <p id="capture-status" class="status" role="status" aria-live="polite"></p>
      </div>
      <input id="photo" class="visually-hidden" type="file" accept="image/*,.heic,.heif" tabindex="-1" aria-hidden="true">
      <input id="camera" class="visually-hidden" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
    </section>

    <section id="result" class="view result" aria-labelledby="result-title" hidden></section>
  </main>

  <footer class="footer">
    <p class="footer__legal"><button class="footer__link" type="button" data-legal="terms" aria-haspopup="dialog">Terms of Service</button><button class="footer__link" type="button" data-legal="privacy" aria-haspopup="dialog">Privacy Policy</button></p>
  </footer>

  <button id="plus-button" class="plus" type="button" aria-label="Snap a meal" title="Snap a meal" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-kicker sheet-title">
    <div class="sheet__inner">
      <div class="sheet__grab" aria-hidden="true"><span></span></div>
      <div class="sheet__head">
        <div class="sheet__titles">
          <p id="sheet-kicker" class="eyebrow"></p>
          <h2 id="sheet-title" class="sheet__title" tabindex="-1"></h2>
          <p id="sheet-intro" class="sheet__intro" hidden></p>
        </div>
        <button class="icon-btn" type="button" data-action="close-sheet" aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button>
      </div>
      <div id="sheet-body" class="sheet__body"></div>
    </div>
  </dialog>

  <dialog id="account" class="sheet sheet--account" aria-labelledby="account-kicker account-title">
    <div class="sheet__inner">
      <div class="sheet__grab" aria-hidden="true"><span></span></div>
      <div class="sheet__head">
        <div class="sheet__titles">
          <p id="account-kicker" class="eyebrow">MealScholar</p>
          <h2 id="account-title" class="sheet__title" tabindex="-1"></h2>
          <p id="account-intro" class="sheet__intro" hidden></p>
        </div>
        <button class="icon-btn" type="button" data-action="close-account" aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button>
      </div>
      <div id="account-body" class="sheet__body"></div>
    </div>
  </dialog>

  <dialog id="panel" class="sheet sheet--panel" aria-labelledby="panel-kicker panel-title">
    <div class="sheet__inner">
      <div class="sheet__grab" aria-hidden="true"><span></span></div>
      <div class="sheet__head">
        <div class="sheet__titles">
          <p id="panel-kicker" class="eyebrow"></p>
          <h2 id="panel-title" class="sheet__title" tabindex="-1"></h2>
          <p id="panel-intro" class="sheet__intro" hidden></p>
        </div>
        <button class="icon-btn" type="button" data-action="close-panel" aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button>
      </div>
      <div id="panel-body" class="sheet__body"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
